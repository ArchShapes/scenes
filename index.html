<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scenes</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Permanent+Marker&family=Press+Start+2P&family=VT323&family=Inter:wght@300;500&family=Lora:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--ink:#1d1d22;--card:#f5f0e4;--field:#fff;--grid:rgba(70,110,180,.2);--hatch:rgba(29,29,34,.55);--wavy:rgba(29,29,34,.55);--vig:rgba(90,70,40,.18);color-scheme:light}
.night{--ink:#f1ece0;--card:#23232b;--field:#14141a;--grid:rgba(120,150,230,.14);--hatch:rgba(241,236,224,.32);--wavy:rgba(241,236,224,.5);--vig:rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:inherit;margin:0}
html,body{height:100%;background:#000;font-family:"Caveat","Comic Sans MS",cursive;overflow:hidden}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw 20vh;
 background-color:var(--paper);
 background-image:radial-gradient(ellipse at center,transparent 55%,var(--vig)),linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
 background-size:100% 100%,4vh 4vh,4vh 4vh}
.scene{transition:opacity var(--fade,100ms) linear}
.scene.on{display:flex}
.scene.out{opacity:0}
.scene{--hl:var(--hlraw,#9be8b0);--paper:color-mix(in srgb,var(--hl) 12%,var(--card))}
.night .scene{--hl:color-mix(in srgb,var(--hlraw,#9be8b0) 55%,#000)}
.scene.loading{background:#000!important}
.loading{background:#000;background-image:none;padding:0}
.spinner{width:8vh;height:8vh;animation:turn .9s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
/* hand-drawn ground */
.ground{position:absolute;left:0;right:0;bottom:0;height:22vh;z-index:2;border-top:.8vh solid var(--ink);filter:var(--wob,url(#wob));
 background:repeating-linear-gradient(135deg,transparent 0 1.6vh,var(--hatch) 1.6vh 1.8vh)}
.starting .ground{animation:floor 1.2s linear infinite}
@keyframes floor{to{background-position:-2.3vh 0}}
h1{position:relative;z-index:3;font-family:"Permanent Marker","Marker Felt",cursive;font-weight:400;color:var(--tc,var(--ink));font-family:var(--ft,"Permanent Marker",cursive);font-size:calc(min(8.6vw,14vh)*var(--ts,1)*var(--fz,1));line-height:1.15;transform:rotate(var(--rot,-1.6deg))}
h1 span{padding:0 1.6vh;background:var(--hlbg,linear-gradient(transparent 52%,var(--hl) 52% 94%,transparent 94%));-webkit-box-decoration-break:clone;box-decoration-break:clone}
p{position:relative;z-index:3;margin-top:3vh;color:var(--pc,var(--ink));font-family:var(--fb,"Caveat",cursive);font-weight:700;font-size:min(4.4vw,6.6vh);text-decoration:var(--pdec,underline wavy var(--wavy));text-underline-offset:1vh;text-decoration-thickness:.3vh;transform:rotate(-1deg)}
/* floating doodles, drawn-by-hand frame rate */
.fl{color:var(--ink);position:absolute;z-index:1;filter:var(--wob,url(#wob));animation:float var(--d) steps(10,end) infinite;animation-delay:var(--dl)}
.fl svg{width:100%;height:100%;display:block;overflow:visible}
.fl.spin svg{animation:spin 3s steps(12,end) infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--a))}50%{transform:translateY(-3.6vh) rotate(var(--b))}}
@keyframes spin{to{transform:rotate(360deg)}}
.crashed .fl{opacity:.6}
.bar{position:absolute;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px 84px;opacity:0;transition:opacity .2s}
.bar button{font:700 20px "Caveat",cursive;color:var(--ink);background:var(--card);border:2px solid var(--ink);padding:4px 12px;cursor:pointer}
.bar button:focus-visible{outline:3px solid #6a2cff}
.clean .bar,.is-loading .bar{display:none}
.hot{position:fixed;top:0;left:0;right:0;height:92px;z-index:25}
.gear{position:absolute;top:16px;right:16px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;padding:0;background:var(--card);border:2px solid var(--ink);border-radius:50%;cursor:pointer;opacity:0;transition:opacity .2s}
.gear svg{width:34px;height:34px;display:block}
.hot:hover .gear,.hot:hover .bar,.hot:focus-within .gear,.hot:focus-within .bar{opacity:1}
.hot:hover .gear svg{animation:spin 1.6s linear infinite}
.is-loading .hot,.clean .hot{display:none}
.panel{position:fixed;z-index:40;right:16px;top:80px;width:min(94vw,780px);min-width:min(94vw,320px);max-width:100vw;max-height:calc(100vh - 100px);resize:both;display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:3px solid var(--ink);padding:0;box-shadow:6px 6px 0 var(--ink);color:var(--ink);font-family:var(--fb,"Caveat",cursive);font-size:22px;font-weight:700;text-align:left}
.panel[hidden]{display:none}
.panel h2{font:400 30px "Permanent Marker",cursive;margin-bottom:4px}
.panel .sec,.panel summary{font:400 19px "Permanent Marker",cursive;margin:16px 0 6px;opacity:.85;cursor:pointer}
.panel .sec2{margin:10px 0 2px;opacity:.7}
.panel .sec{cursor:default}
.panel .fld{display:block;margin-bottom:4px}
.panel .fld b{font-weight:700;opacity:.7;margin-left:6px}
.panel input{display:block;width:100%;margin:4px 0 10px;padding:6px 10px;font:700 22px "Caveat",cursive;color:var(--ink);background:var(--field);border:2px solid var(--ink)}
.panel input:focus-visible{outline:3px solid #6a2cff}
.panel input[type=range]{padding:0;border:0;background:none;margin:2px 0 8px;accent-color:#6a2cff}
.panel input[type=checkbox]{display:inline-block;width:auto;margin:0 12px 0 4px;transform:scale(1.4);accent-color:#6a2cff}
.panel .row{display:flex;align-items:center;margin-bottom:10px}
.panel .hint{font-size:18px;line-height:1.3;opacity:.75;margin:12px 0}
.panel button{font:700 22px "Caveat",cursive;color:#1d1d22;background:#9be8b0;border:2px solid var(--ink);padding:3px 16px;cursor:pointer;margin-right:8px}
.panel #reset{background:#ffb3a8}
.timer{position:relative;z-index:3;margin-top:2.4vh;font:700 min(6vw,8.5vh) "Caveat",cursive;font-variant-numeric:tabular-nums;color:var(--ink);transform:rotate(1deg)}
.timer:empty{display:none}
.plate{position:fixed;left:3vw;bottom:3vh;z-index:30;padding:.3vh 2vh;background:var(--card);color:var(--ink);border:.5vh solid var(--ink);box-shadow:.7vh .7vh 0 var(--ink);font:400 5vh "Permanent Marker",cursive;transform:rotate(-2deg);max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate[hidden],.is-loading .plate{display:none}
.bg-lined .scene{background-image:radial-gradient(ellipse at center,transparent 55%,var(--vig)),linear-gradient(var(--grid) 1.5px,transparent 1.5px);background-size:100% 100%,100% 4vh}
.bg-dots .scene{background-image:radial-gradient(ellipse at center,transparent 55%,var(--vig)),radial-gradient(var(--grid) 2px,transparent 2.6px);background-size:100% 100%,4vh 4vh}
.bg-plain .scene{background-image:radial-gradient(ellipse at center,transparent 55%,var(--vig))}
.panel select,.panel textarea{display:block;width:100%;margin:4px 0 10px;padding:5px 8px;font:700 21px "Caveat",cursive;color:var(--ink);background:var(--field);border:2px solid var(--ink)}
.panel textarea{height:70px;font-size:16px}
.panel input[type=color]{height:40px;padding:2px}
.panel input[readonly]{opacity:.8}
.panel .two{display:flex;gap:8px}.panel .two>*{flex:1}
.panel button.sm{padding:2px 12px;margin-bottom:8px}
.logo{position:fixed;left:2vw;top:2vh;z-index:30;max-height:13vh;max-width:22vw;object-fit:contain}
.logo[hidden],.is-loading .logo,.is-loading .clock,.is-loading .ticker{display:none}
.clock{position:fixed;right:3vw;bottom:3vh;z-index:30;padding:.3vh 2vh;background:var(--card);color:var(--ink);border:.5vh solid var(--ink);box-shadow:.7vh .7vh 0 var(--ink);font:400 5vh "Permanent Marker",cursive;transform:rotate(1.5deg)}
.clock[hidden]{display:none}
.ticker{position:fixed;left:0;right:0;bottom:0;height:5.6vh;z-index:31;overflow:hidden;background:var(--ink);color:var(--card);white-space:nowrap;font:700 3.8vh/5.6vh "Caveat",cursive}
.ticker[hidden]{display:none}
.ticker span{display:inline-block;padding-left:100vw;animation:tick var(--tk,20s) linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.has-ticker .plate,.has-ticker .clock{bottom:8.5vh}
.panel .drop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;margin:4px 0 12px;border:2px dashed var(--ink);transition:background .15s}
.panel .drop.over{background:color-mix(in srgb,#9be8b0 35%,transparent)}
.panel .drop span{font-size:19px;opacity:.75;flex:1;min-width:90px}
.panel .drop img{width:46px;height:46px;object-fit:contain;border:2px solid var(--ink);background:var(--field)}
.panel .drop button{margin:0}
.filebtn{position:relative;display:inline-flex;align-items:center;cursor:pointer;font:700 22px "Caveat",cursive;padding:3px 16px;background:#9be8b0;color:#1d1d22;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.filebtn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.filebtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.filebtn:focus-within{outline:3px solid #6a2cff;outline-offset:2px}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0}

:root{--ft:"Permanent Marker",cursive}
.fx{position:fixed;inset:0;pointer-events:none;z-index:35}
.panel,.plate,.clock,.panel input,.panel select,.panel textarea,.panel button,.bar button,.filebtn,.ticker{border-radius:var(--rad,0)}
.panel input,.panel select,.panel textarea,.panel button{font-family:inherit}
.panel h2,.panel .sec,.panel summary,.plate,.clock{font-family:var(--ft)}
.phead{flex:none;display:flex;align-items:stretch;justify-content:space-between;height:40px;padding:0 0 0 16px;background:var(--ink);color:var(--card);cursor:default;user-select:none;-webkit-user-select:none;touch-action:none}
.phead h2{margin:0;align-self:center;color:var(--card);font-size:22px;line-height:1}
.panel .x{background:transparent;color:var(--ink);font-size:32px;line-height:1;padding:0 10px;margin:0;border:0}
.tabs{flex:none;display:flex;gap:6px;flex-wrap:wrap;padding:6px 22px 12px;border-bottom:2px solid var(--ink)}
.panel .tabs button{background:transparent;color:var(--ink);margin:0;padding:3px 14px}
.panel .tabs button.on{background:#9be8b0;color:#1d1d22}
.pbody{overflow:auto;padding:8px 22px;flex:1}
.tab{display:none;grid-template-columns:1fr 1fr;column-gap:22px;align-items:start}
.tab.on{display:grid}
.tab .full{grid-column:1/-1}
.pfoot{display:flex;align-items:center;gap:12px;padding:12px 30px 12px 22px;flex:none;border-top:2px solid var(--ink)}
.pfoot .hint{margin:0;flex:1}
@media(max-width:600px){.tab{grid-template-columns:1fr}}
@keyframes pollen{to{background-position:-18vh -22vh}}
@keyframes blink{50%{opacity:.35}}
@keyframes cloud{50%{transform:translateX(4vw)}}
@keyframes twinkle{50%{opacity:.45}}
@keyframes slide{to{background-position:0 10vh}}
@keyframes vhs{50%{opacity:.8}}
.th-minecraft{--ft:"Press Start 2P",monospace;--fb:"VT323",monospace;--hlbg:none;--rot:0deg;--fz:.6;--pdec:none;--wob:none;--rad:0;--tc:#fff;--pc:#fff;--ink:#1c1c1c;--card:#c6c6c6;--field:#e9e9e9;--o2:0;--fo:0px;--sw:3px}
.th-minecraft.night{--ink:#f2f2f2;--card:#3a3a3a;--field:#1f1f1f}
.th-minecraft .scene{background:linear-gradient(#6ea8ff,#c9e8ff 72%)}
.th-minecraft.night .scene{background:linear-gradient(#070b1f,#1a2a5e 75%)}
.th-minecraft h1{text-shadow:.7vh .7vh 0 #3b3b3b}
.th-minecraft p{font-size:min(5.4vw,8vh);font-weight:400;text-shadow:.45vh .45vh 0 #3b3b3b}
.th-minecraft .ground{border-top:0;box-shadow:none;background:linear-gradient(#62b13d 0 3.4vh,#4a8f2c 3.4vh 4.6vh,transparent 4.6vh),repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2vh,transparent 2vh 4vh),repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 2vh,transparent 2vh 4vh),#8a5b34}
.th-minecraft.night .ground{filter:brightness(.5)}
.th-minecraft .scene::after{content:"";position:absolute;left:12%;top:11%;width:12vh;height:3.4vh;background:#fff;box-shadow:3.4vh -3.4vh #fff,7vh 0 #fff,38vw 7vh #fff,41vw 3.6vh #fff,45vw 7vh #fff,52vw 9vh #fff;opacity:.92;pointer-events:none}
.th-minecraft.night .scene::after{left:8%;top:9%;width:.8vh;height:.8vh;box-shadow:12vw 5vh #fff,24vw 2vh #fff,37vw 8vh #fff,52vw 3vh #fff,63vw 10vh #fff,76vw 4vh #fff,88vw 8vh #fff,18vw 18vh #fff,45vw 16vh #fff,70vw 19vh #fff}
.th-minecraft .fl svg{shape-rendering:crispEdges}
.th-minecraft .panel,.th-minecraft .plate,.th-minecraft .clock{border-color:#000;box-shadow:inset .4vh .4vh 0 rgba(255,255,255,.5),inset -.4vh -.4vh 0 rgba(0,0,0,.35)}
.th-minecraft .panel{font-size:25px}.th-minecraft .panel h2{font-size:20px}.th-minecraft .panel .sec,.th-minecraft .panel summary{font-size:12px}
.th-minecraft .plate,.th-minecraft .clock{font-size:3vh}
.th-minimal{--ft:"Inter",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif;--hlbg:linear-gradient(transparent 90%,var(--hl) 90%);--rot:0deg;--fz:.85;--pdec:none;--wob:none;--rad:10px;--o2:0;--fo:0px;--sw:2px;--ink:#1a1a1a;--card:#fff;--field:#f1f0ec;--pc:rgba(26,26,26,.6)}
.th-minimal.night{--ink:#ececec;--card:#1b1c1f;--field:#0f1012;--pc:rgba(236,236,236,.6)}
.th-minimal .scene{background:#f6f5f1}
.th-minimal.night .scene{background:#0e0f11}
.th-minimal h1{font-weight:300;letter-spacing:-.03em}
.th-minimal p{font-weight:500;font-size:min(3vw,4.2vh);letter-spacing:.14em;text-transform:uppercase}
.th-minimal .ground{height:20vh;border-top:1px solid var(--ink);background:none;box-shadow:none;opacity:.4}
.th-minimal .fl{opacity:.5}
.th-minimal .panel,.th-minimal .plate,.th-minimal .clock{box-shadow:0 10px 40px rgba(0,0,0,.18);border-width:1px}
.th-minimal .panel{font-size:20px;font-weight:500}
.th-natural{--ft:"Lora",serif;--fb:"Lora",serif;--hlbg:linear-gradient(transparent 30%,color-mix(in srgb,var(--hl) 45%,transparent) 30% 92%,transparent 92%);--rot:-1deg;--fz:.9;--pdec:none;--wob:none;--rad:14px;--o2:.35;--fo:2px;--sw:3px;--ink:#2f3b25;--card:#f3ecd7;--field:#fffaf0;--pc:#5b6b45}
.th-natural.night{--ink:#e7efd9;--card:#1d2a20;--field:#121c15;--pc:#a9c08a}
.th-natural .scene{background:radial-gradient(circle at 85% 12%,rgba(255,226,140,.7),transparent 28%),linear-gradient(#efe6c9,#d8e4b8)}
.th-natural.night .scene{background:radial-gradient(circle at 85% 12%,rgba(190,220,255,.25),transparent 22%),linear-gradient(#0b1510,#17281d)}
.th-natural h1{font-style:italic;font-weight:600}
.th-natural p{font-weight:600;font-size:min(3.8vw,5.6vh);font-style:italic}
.th-natural .ground{border-top:0;height:24vh;border-radius:50% 50% 0 0/9vh 9vh 0 0;background:linear-gradient(#86ad5c,#4f7d3b);box-shadow:inset 0 1.2vh 0 rgba(255,255,255,.18)}
.th-natural.night .ground{background:linear-gradient(#244a2c,#142a1b)}
.th-natural .scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.8) 0 .35vh,transparent .5vh) 0 0/9vh 11vh;opacity:.4;animation:pollen 40s linear infinite}
.th-natural.night .scene::after{background:radial-gradient(circle,rgba(255,240,150,.95) 0 .4vh,transparent .9vh) 0 0/13vh 17vh;opacity:.85;animation:pollen 50s linear infinite,blink 3s ease-in-out infinite}
.th-dream{--ft:"Cormorant Garamond",serif;--fb:"VT323",monospace;--hlbg:none;--rot:0deg;--fz:1.15;--pdec:none;--wob:none;--rad:22px;--o2:0;--fo:2px;--sw:3px;--ink:#5a3d7a;--card:#fff0fa;--field:#fff;--tc:#fff;--pc:#fff}
.th-dream.night{--ink:#d9c7ff;--card:#241545;--field:#150c2e}
.th-dream h1{font-style:italic;font-weight:700;letter-spacing:.02em;text-shadow:0 0 1.6vh #fff,0 0 4vh #ff9ad5,.35vh 0 0 rgba(255,60,120,.65),-.35vh 0 0 rgba(60,200,255,.65)}
.th-dream p{font-size:min(5vw,7.6vh);font-weight:400;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 0 1.2vh #ffc9ee,.3vh 0 rgba(255,60,120,.5),-.3vh 0 rgba(60,200,255,.5)}
.th-dream .scene{background:radial-gradient(ellipse at 20% 18%,#fff 0,transparent 22%),radial-gradient(ellipse at 78% 26%,rgba(255,255,255,.55) 0,transparent 26%),linear-gradient(#ffc9e6,#d5c8ff 45%,#bfe6ff 75%,#fff3d1)}
.th-dream.night .scene{background:radial-gradient(circle at 80% 18%,#fff6d8 0 5vh,rgba(255,240,200,.25) 5.2vh,transparent 18vh),linear-gradient(#0b0724,#2a1457 55%,#6a2d8f 90%)}
.th-dream .scene::before{content:"PLAY \25B6";position:absolute;left:3vw;top:3vh;z-index:5;font:4vh/1 "VT323",monospace;color:#fff;text-shadow:.3vh 0 rgba(255,60,120,.7),-.3vh 0 rgba(60,200,255,.7)}
.th-dream .scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 14vh 5vh at 12% 62%,#fff,transparent 70%),radial-gradient(ellipse 18vh 6vh at 60% 20%,rgba(255,255,255,.8),transparent 70%),radial-gradient(ellipse 12vh 4vh at 88% 55%,#fff,transparent 70%),radial-gradient(ellipse 16vh 5vh at 30% 8%,rgba(255,255,255,.7),transparent 70%);animation:cloud 30s ease-in-out infinite}
.th-dream.night .scene::after{background:radial-gradient(circle,#fff 0 .3vh,transparent .5vh) 0 0/11vh 9vh,radial-gradient(circle,#ffe9ff 0 .2vh,transparent .4vh) 5vh 4vh/17vh 13vh;animation:twinkle 4s ease-in-out infinite}
.th-dream .ground{border-top:0;height:40vh;box-shadow:none;background:conic-gradient(#fff 25%,#f3b8e3 0 50%,#fff 0 75%,#f3b8e3 0) 0 0/10vh 10vh;transform:perspective(55vh) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%);animation:slide 6s linear infinite}
.th-dream.night .ground{background:conic-gradient(#2c1a5c 25%,#6d3fb0 0 50%,#2c1a5c 0 75%,#6d3fb0 0) 0 0/10vh 10vh}
.th-dream .fl{opacity:.9;filter:drop-shadow(0 0 1.2vh #fff) drop-shadow(0 0 2.6vh #ff9ad5);animation-timing-function:ease-in-out}
.th-dream .fx{background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,rgba(0,0,0,.08) 2px 4px),radial-gradient(ellipse at center,transparent 55%,rgba(70,20,110,.4));animation:vhs .15s steps(2) infinite}
.th-dream .panel,.th-dream .plate,.th-dream .clock{box-shadow:0 0 3vh rgba(255,154,213,.6)}
.th-dream .panel{font-size:25px;font-weight:400}.th-dream .panel input,.th-dream .panel select,.th-dream .panel textarea{font-weight:400}

/* ---- settings window (Windows-style title bar) ---- */
.panel .wctl{display:flex}
.panel .wbtn{display:flex;align-items:center;justify-content:center;width:46px;height:auto;margin:0;padding:0;border:0;border-radius:0;background:transparent;color:var(--card);font-size:20px;cursor:pointer}
.panel .wbtn svg{width:11px;height:11px;display:block;fill:none;stroke:currentColor;stroke-width:1.2}
.panel .wbtn:hover{background:color-mix(in srgb,var(--card) 22%,transparent)}
.panel .wbtn.x:hover{background:#e81123;color:#fff}
.panel .wbtn:focus-visible{outline:2px solid var(--card);outline-offset:-4px}
.panel.moved{max-height:calc(100vh - 16px)}
.panel.drag{opacity:.92}
.panel.narrow .tab{grid-template-columns:1fr}
.panel.min{height:auto!important;min-height:0!important;resize:none}
.panel.min .tabs,.panel.min .pbody,.panel.min .pfoot{display:none}
.panel.max{left:0!important;top:0!important;right:auto!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;resize:none;border-width:0;box-shadow:none}
.panel.max.min{height:auto!important}
/* ---- custom dropdown ---- */
.cdd{position:relative}
.panel .cdd-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin:4px 0 10px;padding:5px 8px;text-align:left;font-family:inherit;font-weight:700;font-size:21px;color:var(--ink);background:var(--field);border:2px solid var(--ink);cursor:pointer}
.panel .cdd-btn:focus-visible{outline:3px solid #6a2cff}
.cdd-arrow{width:14px;height:9px;flex:none;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.cdd-btn[aria-expanded=true] .cdd-arrow{transform:rotate(180deg)}

var dd=$("theme"),ddBtn=$("theme-btn"),ddList=dd.querySelector(".cdd-list"),ddOpts=[].slice.call(ddList.children),ddAct=0;

/* ---- music: synthesized loop, starts on first key press or click ---- */
var AC,master,bus,filt,mode="loading",stp=0,nextT=0,BPM=S.bpm,S16=60/S.bpm/4,nz;
var CFG={loading:{bass:1,cut:600,v:.8},checking:{bass:1,arp:1,cut:3200,v:.9},brb:{bass:1,arp:1,hat:1,kick:1,cut:14000,v:1},starting:{bass:1,arp:1,hat:1,kick:1,cut:14000,v:1},crashed:{bass:1,cut:380,v:.8}};
CFG.hype=CFG.starting;CFG.chill=CFG.checking;CFG.dark=CFG.crashed;CFG.bass=CFG.loading;CFG.off={cut:200,v:0};
var ROOT=[57,53,48,55],BASS=[33,29,36,31],INT=[[0,3,7],[0,4,7],[0,4,7],[0,4,7]],PAT=[0,2,4,5,4,2,3,1];
function mf(m){return 440*Math.pow(2,(m-69)/12)}
function tone(t,f,d,type,v,dest){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
function noise(t,d,type,freq,v){var n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=nz;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);n.connect(f);f.connect(g);g.connect(bus);n.start(t);n.stop(t+d+.02)}
function setMode(m){mode=m;if(AC)filt.frequency.setTargetAtTime((CFG[m]||CFG.loading).cut,AC.currentTime,.2)}
function play(i,t){
 var c=CFG[mode]||CFG.loading,bar=Math.floor(i/16)%4,st=i%16,r=ROOT[bar];
 if(st%4===0)setTimeout(pulse,Math.max(0,(t-AC.currentTime)*1000));
 if(c.kick&&st%4===0){var o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3);
  bus.gain.setValueAtTime(.3,t);bus.gain.linearRampToValueAtTime(1,t+.2)}
 if(c.kick&&(st===4||st===12))noise(t,.12,"bandpass",1600,.35);
 if(c.hat&&st%4===2)noise(t,.06,"highpass",7500,.22);
 if(c.hat&&c.kick&&st%2===1)noise(t,.03,"highpass",9000,.08);
 if(c.bass&&[0,3,6,8,10,12].indexOf(st)>=0)tone(t,mf(BASS[bar]),S16*2.2,"sawtooth",.34*c.v,bus);
 if(c.arp){var ch=INT[bar],k=PAT[st%8],n=r+12+ch[k%3]+(k>2?12:0);tone(t,mf(n),S16*1.4,"square",.07*c.v,bus);tone(t,mf(n),S16*1.4,"square",.05*c.v,dl)}
}
var dl;
function sched(){while(nextT<AC.currentTime+.15){play(stp,nextT);nextT+=S16;stp=(stp+1)%64}}
function startAudio(){
 if(AC){if(AC.state==="suspended")AC.resume();return}
 var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
 AC=new A();mode=curMood();master=AC.createGain();master.gain.value=S.music?S.vol/100:0;filt=AC.createBiquadFilter();filt.type="lowpass";filt.frequency.value=(CFG[mode]||CFG.loading).cut;
 bus=AC.createGain();bus.connect(filt);filt.connect(master);master.connect(AC.destination);
 dl=AC.createDelay(1);dl.delayTime.value=S16*3;var fb=AC.createGain();fb.gain.value=.4;dl.connect(fb);fb.connect(dl);dl.connect(bus);
 nz=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var d=nz.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 nextT=AC.currentTime+.1;setInterval(sched,25);
}
document.addEventListener("pointerdown",startAudio);
function pulse(){if(!S.pulse)return;document.querySelectorAll(".scene.on h1,.scene.on .fl,.scene.on .spinner").forEach(function(el){if(el.animate)el.animate([{scale:el.tagName==="H1"?1.045:1.16},{scale:1}],{duration:280,easing:"ease-out"})})}
(function fb(){if(!AC)pulse();setTimeout(fb,60000/BPM)})();
document.addEventListener("keydown",function(e){
 if(e.key==="Escape"){togglePanel(false);return}
 var t=e.target;if(t&&t.matches&&t.matches("input:not([type=checkbox]):not([type=range]),select,textarea"))return;

 if(k===g.dark){S.dark=S.dark?0:1;save();sync();applyAll()}
 else if(k===g.set){e.preventDefault();togglePanel(panel.hidden)}
 else if(k===g.music){S.music=S.music?0:1;save();sync();applyAll()}
 else if(k===g.load||(k==="/"&&!S.scenes.some(function(y){return y.key==="/"}))){e.preventDefault();go("loading")}
 else{var x=S.scenes.filter(function(y){return y.key===k})[0];if(x)go(x.id)}
});
